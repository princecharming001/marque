  youtube_shorts: {top: 288, bottom: 672, left: 48, right: 192}                # A for ads, X organic; platforms.md
  tiktok: {top: [140, 200], bottom: [250, 480], left: 60, right: [120, 180]}   # V (third-party maps); platforms.md
  house_band: {x: [65, 888], y: [288, 1248]}                                   # I from A; platforms.md
  house_band_centre_x: 476                        # X; platforms.md
  relaxed_organic_caption_floor_y: 1436           # X; captions-and-text.md, platforms.md
  ig_only_text_right_x: 1015                      # X; platforms.md
  grid_crop_3x4_y: [240, 1680]                    # V; platforms.md

# ---------------------------------------------------------------- transitions and graphics (frames at 30 fps)
transitions:                                      # mixed tiers; transitions-and-graphics.md
  hard_or_jl_share_min: 0.90                      # V; transitions-and-graphics.md
  stylized_default: 0                             # P + V; transitions-and-graphics.md
  stylized_max: 2                                 # P + V; transitions-and-graphics.md
  whip_frames: [6, 12]                            # P + X; transitions-and-graphics.md
  flash_frames: [2, 4]                            # X; transitions-and-graphics.md
  zoom_transition_frames: [4, 8]                  # X; transitions-and-graphics.md
  dissolve_frames: [8, 15]                        # P + X; transitions-and-graphics.md (never inside a talking head)
  j_cut_lead_frames: [1, 3]                       # V + X; transitions-and-graphics.md
  j_cut_section_change_max_s: 0.5                 # V + X; transitions-and-graphics.md
  ui_animation_ms: [100, 500]                     # P; transitions-and-graphics.md
