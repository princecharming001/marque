  generated_candidates: [4, 8]                    # X; sfx.md

# ---------------------------------------------------------------- voice processing
voice:                                            # mixed tiers; voice-and-loudness.md
  denoise_by_snr_db:                              # X bands (+-4 dB fuzzy); voice-and-loudness.md
    none_at_or_above: 25                          # X; voice-and-loudness.md
    light_band: [20, 25]                          # X; voice-and-loudness.md (limit 6-12 dB, only if audible)
    standard_band: [10, 20]                       # X; voice-and-loudness.md (limit 12-18 dB)
    heavy_below: 10                               # X; voice-and-loudness.md (limit 18-24 dB; consider a pickup)
  attenuation_limit_max_db: 24                    # I + V; voice-and-loudness.md
  dereverb_by_c50_db: {none_at_or_above: 20, only_if_tails: [10, 20], candidate_below: 10}   # X; voice-and-loudness.md
  restoration_wer_increase_max_points: 1          # I; voice-and-loudness.md
  restoration_rolloff_change_max_pct: 10          # X; voice-and-loudness.md
  restoration_lag_max_ms: 1                       # I; voice-and-loudness.md
  clipping_flag_samples: 3                        # X; voice-and-loudness.md (at >= -0.1 dBFS in a kept word)
  highpass_hz: [80, 100]                          # P; voice-and-loudness.md (85 thin, 110-120 boomy)
  mud_cut_db: [2, 4]                              # V + X; voice-and-loudness.md
  mud_band_hz: [200, 400]                         # V; voice-and-loudness.md
  presence_boost_db: [0, 3]                       # V + X; voice-and-loudness.md
  deess_db: [2, 6]                                # V + X; voice-and-loudness.md
  compression_ratio: [1.5, 2.0]                   # P; voice-and-loudness.md (3-4:1 only for dense delivery over music)
  compression_gr_db: [2, 3]                       # P; voice-and-loudness.md (5-6 on emphasised words)
  compression_attack_ms: 10                       # P; voice-and-loudness.md
  compression_release_ms: [100, 150]              # P; voice-and-loudness.md
  leveler_range_db: [2, 3]                        # P + X; voice-and-loudness.md
  adjacent_segment_match_lu: 1.5                  # P + X; voice-and-loudness.md, styles/podcast-sales-founder.md
  breath_attenuate_to_below_speech_db: [15, 20]   # V + X; voice-and-loudness.md
  breath_that_aids_recall_ms: 600                 # L; voice-and-loudness.md
  mono_fold_voice_change_max_db: 1                # X; voice-and-loudness.md

# ---------------------------------------------------------------- loudness
loudness:                                         # I + P; voice-and-loudness.md
