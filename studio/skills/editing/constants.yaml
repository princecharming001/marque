  face_height_frac_tight: [0.38, 0.50]            # X; framing-and-zooms.md
  take_match_face_size_pct: 5                     # X + I; framing-and-zooms.md, endings-loops-ctas.md
  take_match_eye_line_pct: 2                      # X + I; framing-and-zooms.md, endings-loops-ctas.md
  slow_push_pct: [3, 8]                           # X from V; framing-and-zooms.md, styles/story-comedy-hottake.md
