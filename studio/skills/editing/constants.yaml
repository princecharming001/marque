  upsample_face_clean_x: 1.2                      # P + X; framing-and-zooms.md (after a 1:1 eye check)
  upsample_face_hard_limit_x: 1.25                # P + X; framing-and-zooms.md
  landscape_4k_crop_px: [1215, 2160]              # X; framing-and-zooms.md, broll-sourcing.md
  landscape_1080_upsample_x: 1.78                 # X; framing-and-zooms.md, broll-sourcing.md
  eye_line_y_px: [600, 700]                       # P; framing-and-zooms.md
