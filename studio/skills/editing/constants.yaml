# Yunicorn Studio editing doctrine: DEFAULT PRIORS for critics and metrics.
#
# These are starting priors, not rules. A critic that finds a value outside a
# range asks "is there a one-line reason?", never "fail". The only hard rules
# are the validators in studio/ARCHITECTURE.md section 7; keys that mirror a
# validator say "validator". Creator memory overrides priors, never validators.
#
# Tiers: L lab/peer-reviewed | A platform or large-scale data | V vendor
#        P practitioner or standards-body convention | I Yunicorn internal
#        X our inference or arithmetic. "L->X" = a finding applied by inference.
# Every value is ledgered in evidence.md (source link, tier, re-check 2027-03).
# Each comment gives the tier, then the topic file that owns the number.
# Units: seconds unless the key ends in _ms, _frames, _px, _db, _lu, _lufs,
# _pct, _frac, _x (multiplier) or _wpm. Pixels assume 1080x1920 (9:16).
# Pairs are [min, max]. Transition frame counts assume 30 fps; double at 60.

meta:                                             # I; SKILL.md
  version: "2026-09-27"                           # I; SKILL.md
  recheck: "2027-03"                              # I; evidence.md
  output_frame_px: [1080, 1920]                   # X + A; platforms.md

# ---------------------------------------------------------------- calibration
calibration_take:                                 # I n=1; backend/eval/pro_cut_reference.py via SKILL.md
  raw_s: 50                                       # I; SKILL.md, cutting-and-pacing.md
  output_s: 42                                    # I (approx.); cutting-and-pacing.md
  pro_content_splices_mid_video: 1                # I; the "1 cut"; SKILL.md
  pro_small_fixes: 3                              # I; 0.27 s stumble + stalls of 577 and 690 ms; cutting-and-pacing.md
  old_engine_dead_air_splices: 19                 # I; the "19"; SKILL.md, cutting-and-pacing.md
  pauses_ge_300ms_total: 22                       # I; cutting-and-pacing.md, speed.md
  pauses_kept_verbatim: 17                        # I (approx.); cutting-and-pacing.md, speed.md
  silence_ratio_before_after: [0.32, 0.30]        # I; cutting-and-pacing.md
  content_removed_s: 6.9                          # I; SKILL.md

# ---------------------------------------------------------------- hook & structure
hook:                                             # mixed tiers; story-and-hook.md
  first_word_target_s: [0.1, 0.5]                 # X; story-and-hook.md
  first_word_or_payoff_ceiling_s: 2.5             # V n=13; story-and-hook.md, critique.md
  topic_clear_by_s: 3.0                           # A (ads); story-and-hook.md
  hook_set_by_s: 6.0                              # A (ads) + V; story-and-hook.md
  one_idea_max_words: 25                          # X; story-and-hook.md
  alternates: [2, 3]                              # X; story-and-hook.md
  sales_ad_alternates: [3, 5]                     # A (TikTok ads); styles/podcast-sales-founder.md
  hook_speed_x: 1.0                               # X; story-and-hook.md, speed.md
  no_fullscreen_cutaway_s: [1.5, 3.0]             # V; broll.md, story-and-hook.md
  face_returns_after_visual_hook_s: 2.0           # X; broll.md
  no_punch_in_first_s: [1.0, 2.0]                 # X; framing-and-zooms.md
  signature_greeting_max_s: 1.0                   # X; story-and-hook.md
  cold_open_clean_gap_min_ms: 150                 # X; story-and-hook.md
  payoff_position_frac: [0.55, 0.85]              # V n=13; story-and-hook.md

hook_title:                                       # P + X; captions-and-text.md
  max_words: 7                                    # P + X; story-and-hook.md, captions-and-text.md
  zone_y_px: [288, 600]                           # I from A; platforms.md

# ---------------------------------------------------------------- length
length_s:                                         # style files own these; platforms.md mirrors them
  default: [30, 60]                               # A + V (correlational); story-and-hook.md
  real_arc_max: 180                               # A + V; story-and-hook.md
  explainer: [30, 60]                             # A (correlational) -> X; styles/educational-tutorial-listicle.md (45-90 for two-step mechanisms)
  tutorial: [45, 120]                             # A -> X; styles/educational-tutorial-listicle.md
  listicle: [30, 75]                              # L -> X; styles/educational-tutorial-listicle.md (3-5 items)
  storytime: [45, 120]                            # I from A; styles/story-comedy-hottake.md (to 180 if the arc holds)
  comedy: [15, 45]                                # I from A; styles/story-comedy-hottake.md
  hot_take: [15, 45]                              # I from A; styles/story-comedy-hottake.md
  podcast_clip: [30, 90]                          # X + V (DOAC n=3); styles/podcast-sales-founder.md (to ~140)
  sales_ugc: [15, 40]                             # X; styles/podcast-sales-founder.md (aim 20-35)
  founder_brand: [30, 60]                         # X; styles/podcast-sales-founder.md
  loop_candidate_max: 35                          # X; endings-loops-ctas.md

# ---------------------------------------------------------------- pauses and gaps
pauses:                                           # mixed tiers; cutting-and-pacing.md
  articulatory_max_ms: 200                        # L + P; cutting-and-pacing.md (not a picture seam)
  mid_phrase_cut_gap_ms: 100                      # L (one phrase) -> X; cutting-and-pacing.md
  sentence_boundary_keep_ms: [250, 550]           # L (median read pause 493 ms); cutting-and-pacing.md, speed.md
  hesitation_tighten_from_s: [0.6, 1.5]           # X + L; cutting-and-pacing.md
  hesitation_target_ms: [250, 400]                # X; cutting-and-pacing.md, speed.md
  deliberate_beat_s: [0.5, 1.2]                   # X + L; cutting-and-pacing.md (storytime to ~1.5)
  dead_air_cut_over_s: 1.5                        # X; cutting-and-pacing.md, critique.md
  confession_hold_s: [1.5, 3.0]                   # X; cutting-and-pacing.md
  relative_keep_x_median: [0.7, 1.3]              # X; cutting-and-pacing.md, styles/story-comedy-hottake.md
  relative_tighten_over_x_median: 2.0             # X; cutting-and-pacing.md
  boundary_by_energy_ms:                          # X; cutting-and-pacing.md (style files inherit)
    high: [200, 300]                              # X; cutting-and-pacing.md (or the speaker's own if shorter)
    conversational: [250, 450]                    # X; cutting-and-pacing.md
    calm: [350, 700]                              # X; cutting-and-pacing.md
    comedy: performer                             # X + L (weak); cutting-and-pacing.md (cut dead air only)
    podcast_in_turn: [200, 300]                   # X; cutting-and-pacing.md, styles/podcast-sales-founder.md
    podcast_between_turns: [0, 250]               # L; cutting-and-pacing.md, styles/podcast-sales-founder.md
  deliberate_beat_by_energy_s:                    # X; cutting-and-pacing.md
    high: [0.0, 0.6]                              # X; cutting-and-pacing.md, styles/story-comedy-hottake.md
    conversational: [0.5, 0.9]                    # X; cutting-and-pacing.md
    calm: [0.8, 1.5]                              # X; cutting-and-pacing.md, styles/story-comedy-hottake.md
  reluctant_gap_min_ms: 700                       # L; styles/podcast-sales-founder.md (never create or erase one)
  answer_beat_after_s: [0.5, 1.2]                 # X from L; styles/educational-tutorial-listicle.md
  step_boundary_beat_s: [0.4, 0.8]                # X from L; styles/educational-tutorial-listicle.md

fillers:                                          # L -> X; cutting-and-pacing.md
  in_first_sentence: 0                            # X; cutting-and-pacing.md, story-and-hook.md
  per_min_budget: [3, 5]                          # L -> X; cutting-and-pacing.md
  natural_disfluencies_per_100_words: 6           # L; cutting-and-pacing.md
  acceptable_per_min: 5                           # L; cutting-and-pacing.md
  hurts_effectiveness_per_min: 12                 # L; cutting-and-pacing.md
  cut_if_bounded_by_gap_ms: 150                   # X; cutting-and-pacing.md
  coarticulated_cut_min_closure_ms: 20            # X; cutting-and-pacing.md

# ---------------------------------------------------------------- seams
seams:                                            # mixed tiers; cutting-and-pacing.md
  per_60s_clean_take: [1, 4]                      # I n=1 -> X; critic signal, never a gate; cutting-and-pacing.md, critique.md
  every_seam_needs_named_problem: true            # I + X; cutting-and-pacing.md
  cut_padding_ms: [30, 200]                       # P; cutting-and-pacing.md
  asr_drift_ms: [50, 120]                         # P + V; cutting-and-pacing.md, captions-and-text.md
  forced_align_error_ms: 20                       # L; captions-and-text.md, framing-and-zooms.md
  visual_change_interval_s: [3, 8]                # V n=13; cutting-and-pacing.md
  visual_change_median_s: 5                       # V n=13; cutting-and-pacing.md
  static_stretch_question_s: 8                    # X; cutting-and-pacing.md, broll.md, framing-and-zooms.md
  scale_change_to_hide_seam_min_x: 1.25           # X from P; cutting-and-pacing.md, framing-and-zooms.md
  scale_change_to_hide_seam_pref_x: [1.3, 1.5]    # X from P; cutting-and-pacing.md, framing-and-zooms.md
  insert_cover_each_side_s: 0.25                  # X; broll.md
  two_speaker_switch_after_onset_ms: [0, 300]     # L; styles/podcast-sales-founder.md, cutting-and-pacing.md
  two_speaker_motivated_early_ms: 200             # X; styles/podcast-sales-founder.md
  podcast_sustained_switch_max_per_s: 0.5         # L; styles/podcast-sales-founder.md
  podcast_hold_break_s: 12                        # V; styles/podcast-sales-founder.md
  podcast_reaction_cutaway_s: [1.0, 1.5]          # V; styles/podcast-sales-founder.md

audio_seam:                                       # P + X; cutting-and-pacing.md, voice-and-loudness.md
  crossfade_default_ms: [10, 30]                  # P + X; cutting-and-pacing.md, voice-and-loudness.md
  crossfade_silence_or_stop_ms: 2                 # P; cutting-and-pacing.md, voice-and-loudness.md
  crossfade_across_breath_ms: [30, 100]           # P + X; cutting-and-pacing.md, voice-and-loudness.md
  crossfade_coarticulated_filler_ms: [5, 10]      # X; cutting-and-pacing.md
  loop_declick_ramp_ms: [5, 10]                   # X; endings-loops-ctas.md
  level_jump_audible_db: [4, 5]                   # P; cutting-and-pacing.md, voice-and-loudness.md, critique.md
  room_tone_match_db: [1, 2]                      # P + X; voice-and-loudness.md
  never_digital_silence: true                     # validator; voice-and-loudness.md

av_sync_ms:                                       # L; cutting-and-pacing.md, critique.md
  detect_audio_early: 45                          # L (ITU-R BT.1359); cutting-and-pacing.md, critique.md
  detect_audio_late: 125                          # L (ITU-R BT.1359); cutting-and-pacing.md, critique.md
  acceptable_audio_early: 90                      # L (ITU-R BT.1359); speed.md, critique.md
  acceptable_audio_late: 185                      # L (ITU-R BT.1359); speed.md, critique.md
  per_neural_stage_max: 1                         # I; voice-and-loudness.md

# ---------------------------------------------------------------- speed
speed:                                            # mixed tiers; speed.md
  default_x: 1.0                                  # I; speed.md
  gentle_x: [1.03, 1.08]                          # X on L; speed.md
  start_x: 1.05                                   # X; speed.md
  soft_ceiling_x: 1.10                            # X on L; speed.md
  needs_written_reason_x: [1.10, 1.20]            # X on L; speed.md
  effect_only_above_x: 1.20                       # X on L; speed.md
  jnd_tempo_pct: 5                                # L; speed.md
  adjacent_segment_max_delta_x: 0.05              # X; speed.md
  candidate_below_wpm: 150                        # X; speed.md
  very_slow_speaker_wpm: 130                      # X; speed.md
  very_slow_speaker_x: [1.12, 1.15]               # X; speed.md
  dense_content_max_output_wpm: [170, 180]        # L -> X; speed.md
  change_only_at_gap_min_ms: 300                  # X; speed.md
  min_total_saving_s: 1.0                         # X; speed.md
  hard_cap_uniform_x: [1.02, 1.04]                # X; speed.md
  protected_at_1x: [hook, punchline, emotional_line, instruction, payoff, cta]   # X + L; speed.md
  style_cap_x:                                    # X; speed.md and the style files
    educational: 1.0                              # X; speed.md, styles/educational-tutorial-listicle.md
    tutorial_steps: 1.0                           # X; styles/educational-tutorial-listicle.md
    storytime: 1.0                                # X; styles/story-comedy-hottake.md
    comedy: 1.0                                   # X; styles/story-comedy-hottake.md
    podcast_clip: 1.0                             # X; styles/podcast-sales-founder.md
    founder_brand: 1.0                            # X; styles/podcast-sales-founder.md
    hot_take: 1.10                                # X; styles/story-comedy-hottake.md (outside the hook and the take)
    listicle: 1.10                                # X; styles/educational-tutorial-listicle.md
    sales_ugc: 1.10                               # X; styles/podcast-sales-founder.md (demo only)
  fast_forward_gag_x: [1.5, 3.0]                  # X; speed.md
  fast_forward_gag_max_s: 3                       # X; speed.md, styles/story-comedy-hottake.md
  fast_broll_x: [2, 3]                            # P + X; speed.md, broll.md
  timelapse_max_x: 8                              # P + X; speed.md
  ramps_max_per_short: 2                          # V; speed.md (0 by default, picture only)
  ramp_length_s: [0.5, 1.5]                       # V; speed.md
  slow_motion_min_factor: "output_fps / source_fps"   # A + P; speed.md, broll.md
  viewer_side_speed_x: 2                          # A; speed.md

