    comedy: {inserts: [0, 2], fullscreen_share: [0.0, 0.05]}           # X; broll.md
    hot_take: {inserts: [0, 2], fullscreen_share: [0.0, 0.10]}         # X; broll.md
    listicle: {inserts: "0 or 1 per item", fullscreen_share: [0.10, 0.30]}   # X; broll.md
