framing:                                          # mixed tiers; framing-and-zooms.md
  punch_accident_below_x: 1.10                    # V + P; framing-and-zooms.md
  punch_lean_in_x: [1.15, 1.25]                   # V + P; framing-and-zooms.md
  punch_new_shot_x: [1.4, 1.6]                    # V + P; framing-and-zooms.md
  punch_seam_hide_min_x: 1.25                     # X from P; framing-and-zooms.md
  punch_seam_hide_pref_x: [1.3, 1.5]              # X from P; framing-and-zooms.md
  ab_crop_b_x: 1.5                                # V n=3; framing-and-zooms.md
  ab_crop_interval_s: [3.5, 5.6]                  # V n=3; framing-and-zooms.md
  sizes_max: 3                                    # V + X; framing-and-zooms.md
  emphasis_punches_per_60s:                       # I from V; framing-and-zooms.md and the style files
    typical: [0, 2]                               # I from V; framing-and-zooms.md
    ceiling: 4                                    # I from V; framing-and-zooms.md
    hot_take: [0, 2]                              # X; styles/story-comedy-hottake.md
    explainer: [0, 2]                             # I + V; styles/educational-tutorial-listicle.md
    sales_ugc: [2, 4]                             # X; styles/podcast-sales-founder.md
