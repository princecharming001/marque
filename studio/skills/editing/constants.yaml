  graphic_exit_frames: [3, 6]                     # X on P; transitions-and-graphics.md
  graphic_lead_frames: [0, 2]                     # X; transitions-and-graphics.md
  stagger_frames: [2, 4]                          # X; transitions-and-graphics.md
  arrow_draw_frames: [6, 10]                      # X; transitions-and-graphics.md
  gap_between_elements_frames: 6                  # X; transitions-and-graphics.md
  land_on_seam_within_frames: 6                   # X; transitions-and-graphics.md
  overshoot_max_pct: 5                            # P + V; transitions-and-graphics.md
  changing_elements_at_once_max: 1                # X + L; transitions-and-graphics.md, captions-and-text.md
  progress_bar_default: false                     # L (other domains); transitions-and-graphics.md

# ---------------------------------------------------------------- music
music:                                            # mixed tiers; music.md
  level_under_speech_start_lu: [16, 20]           # V + I; music.md, critique.md
  level_under_speech_range_lu: [12, 25]           # V + I; music.md
  sparse_bed_under_speech_lu: [12, 15]            # X; music.md
  separation_floor_lu: 10                         # L; music.md
  separation_floor_over_ambience_lu: 15           # L; music.md
  listener_spread_iqr_lu: 5.7                     # L; music.md
  expert_vs_nonexpert_gap_lu: 4                   # L; music.md
  duck_attack_ms: [50, 300]                       # V + X; music.md
  duck_preroll_ms: [100, 250]                     # X; music.md
  duck_hold_gaps_under_s: 1.0                     # P + X; music.md
  duck_release_s: [0.5, 1.0]                      # P + X; music.md
  swell_db: [4, 8]                                # X; music.md
  swell_gap_min_s: 1.2                            # X; music.md
  carve_db: [2, 4]                                # V + X; music.md
  carve_band_hz: [1000, 4000]                     # V; music.md
  hit_tolerance_frames: 1                         # X on L; music.md
  hits_stingers_dropouts_max: 3                   # X; music.md, critique.md
  stinger_s: [0.5, 2.0]                           # X; music.md
  dropout_s: [0.3, 1.0]                           # X; music.md
  tail_max_s: 0.5                                 # I + P; music.md, endings-loops-ctas.md
  tempo_bpm:                                      # X; music.md (tempo drives arousal, L)
    calm: [60, 90]                                # X; music.md (or no music)
    conversational: [85, 105]                     # X; music.md
    high_energy: [100, 125]                       # X; music.md
  no_music_over_wpm: 185                          # X; music.md
  stretch_max_pct: 3                              # X; music.md ("a few percent")
  generated_tail_s: [1, 2]                        # X; music.md
  candidates: 3                                   # X; music.md
  vocals_under_speech: false                      # L; music.md
  no_music_master_always: true                    # validator; music.md, platforms.md
  style_default:                                  # I; music.md and the style files
    educational: none_or_very_low                 # I; music.md
    tutorial: none_or_light_bed                   # I; styles/educational-tutorial-listicle.md
    listicle: none_or_light_bed                   # I; styles/educational-tutorial-listicle.md
    storytime: none_or_ambient                    # I; styles/story-comedy-hottake.md (18-20 LU if ambient)
    comedy: none_under_jokes                      # X; styles/story-comedy-hottake.md
    hot_take: none                                # I; styles/story-comedy-hottake.md
    podcast_clip: none                            # I + V; styles/podcast-sales-founder.md
    sales_ugc: cleared_bed                        # I + A; styles/podcast-sales-founder.md
    founder_brand: none_or_subtle                 # I; styles/podcast-sales-founder.md

# ---------------------------------------------------------------- sfx
sfx:                                              # mixed tiers; sfx.md
  per_60s_by_style:                               # X; sfx.md and the style files (zero valid everywhere)
    educational: [0, 2]                           # X; sfx.md (0 default, up to 2 functional)
    storytime: [0, 1]                             # X; sfx.md
    comedy: [0, 3]                                # X; sfx.md
    hot_take: [0, 1]                              # X; sfx.md
    listicle: "0 or 1 per item"                   # X; sfx.md
    tutorial: [0, 4]                              # X; sfx.md
