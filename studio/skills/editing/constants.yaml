  punch_onset_lead_ms: [0, 70]                    # X; framing-and-zooms.md
  punch_late_reads_as_mistake_ms: 200             # V; framing-and-zooms.md
  punch_snap_anim_max_ms: 150                     # V; framing-and-zooms.md
  punch_hold_min_s: 1.5                           # X; framing-and-zooms.md
  lossless_ceiling_4k_to_1080_x: 2.0              # X; framing-and-zooms.md
