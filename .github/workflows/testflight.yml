# Build the iOS app on a GitHub-hosted Mac and upload it to TestFlight.
#
# Runs ONLY when a tag named testflight-<anything> is pushed (each TestFlight upload is an explicit, per-time
# approval: see CLAUDE.md "Shipping to live"). The build number comes from ios/project.yml (bump CFBundleVersion and
# CURRENT_PROJECT_VERSION there first; App Store Connect rejects a reused number).
#
# Repository secrets (Settings -> Secrets and variables -> Actions), added by the account owner, never committed:
#   ASC_KEY_P8              contents of AuthKey_<KEY_ID>.p8 (App Store Connect API key, App Manager or Admin role)
#   DIST_CERT_P12_BASE64    base64 of the Apple Distribution certificate exported as .p12 (with its private key)
#   DIST_CERT_PASSWORD      the .p12 export password
#   PROFILE_BASE64          base64 of the "Marque App Store" provisioning profile (.mobileprovision)
# Optional: ASC_KEY_ID / ASC_ISSUER_ID repository variables (default to the IDs in scripts/testflight_add_to_internal.py).
name: TestFlight

on:
  push:
    tags: ["testflight-*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID || '422MKHNWD5' }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || 'c4c8d671-d14d-48b8-a605-94c23a63b2fa' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        env:
          A: ${{ secrets.ASC_KEY_P8 }}
          B: ${{ secrets.DIST_CERT_P12_BASE64 }}
          C: ${{ secrets.DIST_CERT_PASSWORD }}
          D: ${{ secrets.PROFILE_BASE64 }}
        run: |
          missing=""
          [ -n "$A" ] || missing="$missing ASC_KEY_P8"
          [ -n "$B" ] || missing="$missing DIST_CERT_P12_BASE64"
          [ -n "$C" ] || missing="$missing DIST_CERT_PASSWORD"
          [ -n "$D" ] || missing="$missing PROFILE_BASE64"
          if [ -n "$missing" ]; then echo "::error::missing repository secrets:$missing"; exit 1; fi

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Install signing (temporary keychain + profile)
        env:
          P12: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Install the App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate the project
        working-directory: ios
        run: brew install xcodegen >/dev/null && xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild -project Marque.xcodeproj -scheme Marque -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Marque.xcarchive" \
            archive -quiet

      - name: Export the IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Marque.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP/export/"*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Add the build to internal testers (waits for processing)
        run: |
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$RUNNER_TEMP/Marque.xcarchive/Products/Applications/"*.app/Info.plist)
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || \
            pip3 install --quiet pyjwt cryptography
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            python3 scripts/testflight_add_to_internal.py "$BUILD"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect" "$HOME/Library/MobileDevice/Provisioning Profiles" "$RUNNER_TEMP/p.mobileprovision"
