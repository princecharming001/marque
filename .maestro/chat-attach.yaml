appId: com.getmarque.app
name: "Build 66 — chat attach: Photos / Your library toggle"
# The full stitch→upload→analyze→edit pipeline is covered by backend tests +
# the analyze-first flow; this proves the chat entry point is wired: the attach
# sheet offers exactly the two sources (Photos toggle → system video picker).
---
- launchApp:
    arguments:
      demoHome: 1
      backend.url: "http://127.0.0.1:8001"
- tapOn:
    id: "tour.skip"
    optional: true
- extendedWaitUntil:
    visible:
      id: "chat.composer"
    timeout: 8000
- tapOn:
    id: "chat.attach"
- extendedWaitUntil:
    visible:
      id: "chat.attachSource"
    timeout: 4000
- assertVisible: "Your library"
- takeScreenshot: /tmp/r5-chat-attach
- tapOn:
    id: "chat.attachPhotos"
- takeScreenshot: /tmp/r5-chat-picker
