appId: com.getmarque.app
name: "media-lifecycle M1 — overlay chip tap (compare), Sound panel → Add sound → track.0 → lane"
# env: OUT, TAG (editor open at root)
---
- tapOn: { id: "editorPro.overlay.0" }
- waitForAnimationToEnd: { timeout: 1500 }
- takeScreenshot: ${OUT}/${TAG}-0-overlay-chip-tap
- tapOn: { id: "editorPro.ctx.back", optional: true }
- tapOn: { id: "editorPro.root.sound" }
- waitForAnimationToEnd: { timeout: 1500 }
- takeScreenshot: ${OUT}/${TAG}-1-sound-panel
- assertVisible: { id: "editorPro.musicLane.add" }
- tapOn: { id: "editorPro.addSound" }
- extendedWaitUntil: { visible: { id: "editorPro.track.0" }, timeout: 15000 }
- takeScreenshot: ${OUT}/${TAG}-2-music-sheet
- tapOn: { id: "editorPro.track.0" }
- extendedWaitUntil: { visible: { id: "editorPro.musicLane" }, timeout: 15000 }
- waitForAnimationToEnd: { timeout: 1500 }
- takeScreenshot: ${OUT}/${TAG}-3-track-added
