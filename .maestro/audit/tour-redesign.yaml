appId: com.getmarque.app
---
- launchApp:
    clearState: true
    arguments:
      backend.url: "http://127.0.0.1:8001"
    permissions:
      all: allow

- assertVisible: "Get started"
# Landing screen — UnicornHero mascot, mid-idle-loop. Two shots a beat apart prove motion.



# The tour is a Home feature — the onboarding quiz is not under test here.
# Use the sanctioned dev hook to jump straight to a seeded Home.
- tapOn: { id: dev.jump }
- tapOn: ".*Home \\(test user\\).*"   # dev menu item reads "② Home (test user)"
# The coach card is modal for VoiceOver (2026-09-24 redesign), so once the tour is up the
# rest of Home leaves the accessibility tree: wait for the tour, not for home.voiceBubble.

# Tour should auto-start ~900ms after Home appears.
# 2026-09-24: Stoic redesign of the walkthrough (coach card + ink art); titles below are the new copy.
- extendedWaitUntil:
    visible: { id: tour.next }
    timeout: 5000
- takeScreenshot: ${OUT}/tour-step1-voicebubble
- tapOn: { id: tour.next }
- assertVisible: "rather type?"
- takeScreenshot: ${OUT}/tour-step2-chat
- tapOn: { id: tour.next }
- assertVisible: "film yourself."
- takeScreenshot: ${OUT}/tour-step3-film
- tapOn: { id: tour.next }
- assertVisible: "your clips live here."
- takeScreenshot: ${OUT}/tour-step4-library
- tapOn: { id: tour.next }
- assertVisible: "see what's working."
- takeScreenshot: ${OUT}/tour-step5-performance
- tapOn: { id: tour.next }
# Tour finished — overlay gone, plain Home again.
- assertNotVisible: { id: tour.next }
- takeScreenshot: ${OUT}/tour-finished

# Replay from Settings → should re-show step 1 even though the tour already completed once.
- tapOn: { id: home.profile }
- tapOn: { id: profile.settings }
- scrollUntilVisible: { element: { id: settings.replayTour }, direction: DOWN, timeout: 30000 }
- tapOn: { id: settings.replayTour }
- extendedWaitUntil:
    visible: { id: tour.next }
    timeout: 5000
- takeScreenshot: ${OUT}/tour-replayed
