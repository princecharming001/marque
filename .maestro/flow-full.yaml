appId: com.getmarque.app
name: Marque — full core loop
---
- launchApp:
    arguments:
      reset: "true"
      # Drive the LOCAL keyless backend (scripts/dev.sh test expects one on :8000) —
      # the Debug plist points at prod Render, which would mock-fallback past the
      # analyze-first brief screen this flow asserts.
      backend.url: "http://127.0.0.1:8001"

# Landing (cream, unicorn hero)
- assertVisible: "Get started"
- tapOn:
    id: "onboard.start"

# Q1: niche chips — the ONE framing question before value (auto-advances on tap).
- assertVisible: "What do you make videos about?"
- tapOn:
    id: "onboard.niche.fitness"

# Connect (hero) — fast path = skip. The cut steps must be GONE:
# no blocker/whyNow/method/name/stage/platform/interview/sliders/comfort.
- extendedWaitUntil:
    visible: "Let me study your page"
    timeout: 4000
- assertNotVisible: "What gets in the way most?"
- tapOn:
    id: "onboard.connect.skip"

# Identity — one question: audience (niche already covered the topic).
- assertVisible: "Who's it for?"
- tapOn:
    id: "onboard.audience"
- inputText: "busy professionals"
- tapOn:
    id: "onboard.identityContinue"

# Emulate creators (multi-select; fast path = skip)
- extendedWaitUntil:
    visible: "Who do you want to sound like?"
    timeout: 4000
- tapOn:
    id: "onboard.emulate.skip"

# Goal (auto-advance) — kept because it personalizes the paywall headline.
- extendedWaitUntil:
    visible: "What are you here to do?"
    timeout: 4000
- tapOn:
    id: "onboard.goal.audience"

# Pace — the LAST question; its CTA kicks the starter-script build directly
# (the brand-mirror interstitial was cut).
- extendedWaitUntil:
    visible: "How often do you want to post?"
    timeout: 4000
- tapOn:
    id: "onboard.continue"

# Non-blocking aha: staged build screen → ready (live Claude writes 3 scripts; allow time)
- extendedWaitUntil:
    visible: "Enter Yunicorn"
    timeout: 120000
- takeScreenshot: /Users/home/Marque/.shots/live-aha
# The pill staggers in (staggerReveal) — let the animation settle or the tap's
# hierarchy snapshot misses the still-moving element.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Enter Yunicorn"

# Gate 1 (REORDERED): hard subscription wall first. The tap is optional:
# a real/leftover StoreKit entitlement in the simulator legitimately skips
# this screen entirely.
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "paywall.devContinue"
    optional: true

# Gate 2: account wall (demo path in dev builds)
- extendedWaitUntil:
    visible:
      id: "auth.demoContinue"
    timeout: 6000
- tapOn:
    id: "auth.demoContinue"

# Into the app — Home with the voice bubble
- extendedWaitUntil:
    visible:
      id: "home.voiceBubble"
    timeout: 6000
- takeScreenshot: /Users/home/Marque/.shots/v3-home

# First-run feature tour overlays the whole screen on a fresh install — skip it
# (optional: absent when the app has run before on this sim).
- tapOn:
    id: "tour.skip"
    optional: true

# Film flow: FAB → readied script (seeded by onboarding) → reader → record
- tapOn:
    id: "film.open"
- extendedWaitUntil:
    visible:
      id: "film.readied"
    timeout: 6000
- takeScreenshot: /Users/home/Marque/.shots/v3-film-queue
- tapOn:
    id: "film.readied"
    index: 0
# The script reader opened — record CTA is pinned at the bottom (Shot plan is
# further down the scroll, so assert the always-visible record button instead).
- extendedWaitUntil:
    visible:
      id: "script.record"
    timeout: 6000
- tapOn:
    id: "script.record"
- extendedWaitUntil:
    visible:
      id: "record.capture"
    timeout: 6000
- assertVisible:
    id: "record.upload"
- tapOn:
    id: "record.capture"
- extendedWaitUntil:
    visible:
      id: "record.makeClips"
    timeout: 8000
- tapOn:
    id: "record.makeClips"

# H-02/H-03 analyze-first: the editor's plan (brief + toggles) appears — keyless
# backend returns it immediately; confirm to actually make the clip.
- extendedWaitUntil:
    visible: "YOUR EDIT PLAN"
    timeout: 12000
- takeScreenshot: /Users/home/Marque/.shots/flow-brief
# The confirm CTA is pinned below the scrollable plan — directly tappable.
- tapOn:
    id: "record.makeMyClip"

# Session celebration (streak), then clips in Library
- extendedWaitUntil:
    visible:
      id: "celebration.dismiss"
    timeout: 14000
- tapOn:
    id: "celebration.dismiss"
- tapOn: "Library"
- extendedWaitUntil:
    visible: "YOUR CREATIVE VAULT"
    timeout: 6000
- takeScreenshot: /Users/home/Marque/.shots/flow-library

# Performance tab: queue + 30-day insights
- tapOn: "Performance"
- extendedWaitUntil:
    visible: "Coming up"
    timeout: 6000
- takeScreenshot: /Users/home/Marque/.shots/v3-performance

# Chat tab reachable
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "What can I help with?"
    timeout: 6000
