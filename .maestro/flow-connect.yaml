appId: com.getmarque.app
name: Marque — connected onboarding path (scan theater → prefilled confirm)
---
# Connect is real OAuth now (ASWebAuthenticationSession — not automatable), so the
# -seedAccount DEBUG hook injects a linked @mrbeast TikTok account at launch. The
# page scan itself still runs for real against the backend.
- launchApp:
    arguments:
      reset: "true"
      -seedAccount: "true"
- tapOn:
    id: "onboard.start"

# One framing question, then connect is immediately next (the hero step).
- tapOn:
    id: "onboard.niche.fitness"
- extendedWaitUntil:
    visible: "Let me study your page"
    timeout: 4000
# The seeded account renders as a linked card.
- assertVisible:
    id: "connect.linked"
- takeScreenshot: /Users/home/Marque/.shots/connect-verified

# Continue → scan theater holds while the page scan runs (12s cap), then the
# single audience question. Same headline either way; only the subtitle differs
# (prefilled from the scan vs the honest ask when the scrape found nothing).
- tapOn:
    id: "onboard.connect.continue"
- assertVisible: "Reading your posts"
- takeScreenshot: /Users/home/Marque/.shots/connect-scan-theater
- extendedWaitUntil:
    visible: "Who's it for?"
    timeout: 20000
- takeScreenshot: /Users/home/Marque/.shots/connect-identity-prefilled
