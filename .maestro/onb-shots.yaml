appId: com.getmarque.app
name: Marque — onboarding per-step screenshot walk (visual QA)
---
- launchApp:
    arguments:
      reset: "true"

# New 8-screen flow (2026-08 rebuild): landing → niche chips → connect →
# identity → emulate → goal → pace → building. Skip path shown here.
- assertVisible: "Get started"
- takeScreenshot: /Users/home/Marque/.shots/onb-00-landing
- tapOn:
    id: "onboard.start"

- assertVisible: "What do you make videos about?"
- takeScreenshot: /Users/home/Marque/.shots/onb-01-niche
- tapOn:
    id: "onboard.niche.fitness"
- tapOn: { id: "onboard.niche.continue" }

- extendedWaitUntil:
    visible: "Let me study your page"
    timeout: 4000
- takeScreenshot: /Users/home/Marque/.shots/onb-02-connect
- tapOn:
    id: "onboard.connect.skip"

- assertVisible: "Who's it for?"
- takeScreenshot: /Users/home/Marque/.shots/onb-03-identity
- tapOn: { id: "onboard.audience.busy professionals" }
- takeScreenshot: /Users/home/Marque/.shots/onb-03b-identity-filled
- tapOn: { id: "onboard.audience.continue" }

- extendedWaitUntil:
    visible: "What are you here to do?"
    timeout: 4000
- takeScreenshot: /Users/home/Marque/.shots/onb-05-goal
- tapOn:
    id: "onboard.goal.audience"

- extendedWaitUntil:
    visible: "How often do you want to post?"
    timeout: 4000
- takeScreenshot: /Users/home/Marque/.shots/onb-06-pace
# 5/week is the slider default; the tick shortcuts are 1/7/14/21.
- tapOn:
    id: "onboard.continue"

# Building screen may flash past instantly when generation is fast (mock/local
# fallback) — screenshot whatever state we're in, then wait for ready.
- takeScreenshot: /Users/home/Marque/.shots/onb-07-building

- extendedWaitUntil:
    visible: "Enter Yunicorn"
    timeout: 120000
- takeScreenshot: /Users/home/Marque/.shots/onb-08-ready
