appId: com.getmarque.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Connect is the hero step, immediately after the one niche question.
- assertVisible: "Get started"
- tapOn: { id: onboard.start }
- tapOn: { id: onboard.niche.fitness }
- tapOn: { id: "onboard.niche.continue" }
- extendedWaitUntil:
    visible: "Let me study your page"
    timeout: 4000
- takeScreenshot: /Users/home/Marque/.shots/connect-new.png
- tapOn: { id: connect.instagram }
- extendedWaitUntil:
    visible: ".*demo mode.*"
    timeout: 10000
- takeScreenshot: /Users/home/Marque/.shots/connect-mock-msg.png
